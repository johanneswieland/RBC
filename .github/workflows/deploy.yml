# Build the Jupyter Book and publish it to GitHub Pages on every push to main.
# Notebooks are committed with their outputs, so nothing is executed here.
name: Deploy book
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "jupyter-book>=2"
      - run: jupyter-book build --html
        env:
          BASE_URL: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html
      - id: deployment
        uses: actions/deploy-pages@v5
